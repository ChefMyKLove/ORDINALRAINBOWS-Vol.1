<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Twonk Claims Admin</title>
    <style>
:root { --bg: #0a0a12; --panel: #15152a; --line: rgba(255, 255, 255, 0.15); --text: #fff; --muted: rgba(255, 255, 255, 0.65); --accent: #b36bff; }
* { box-sizing: border-box; }
body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
h1 { margin: 0 0 16px; font-size: 1.5em; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
input, select, button { font: inherit; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
button { cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); font-weight: 700; }
button:disabled { opacity: 0.5; }
#msg { color: var(--muted); min-height: 1.4em; margin-bottom: 12px; }
#msg.error { color: #ff8a8a; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.92em; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; }
td.mono { font-family: ui-monospace, Consolas, monospace; font-size: 0.9em; }
.pending { color: #ffc371; }
.delivered { color: #7cff6b; }
    </style>
</head>
<body>
    <h1>🌈 Twonk Claims</h1>

    <form id="login" class="bar">
        <label for="token">Admin token</label>
        <input id="token" type="password" autocomplete="off" required>
        <button class="primary" type="submit">Load claims</button>
    </form>

    <div id="controls" class="bar" hidden>
        <label for="filter">Status</label>
        <select id="filter">
            <option value="pending">Pending</option>
            <option value="delivered">Delivered</option>
            <option value="">All</option>
        </select>
        <button id="refresh" type="button">Refresh</button>
        <button id="csv" type="button">Export CSV</button>
        <button id="logout" type="button">Forget token</button>
    </div>

    <div id="msg" role="status" aria-live="polite"></div>

    <div class="table-wrap">
        <table id="table" hidden>
            <thead><tr><th>Piece</th><th>Twetch handle</th><th>Address</th><th>Status</th><th>Claimed</th><th>Delivered</th><th></th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
    (function () {
        const KEY = 'twonkAdminToken';
        const $ = id => document.getElementById(id);
        let rows = [];

        function getToken() { try { return sessionStorage.getItem(KEY); } catch (e) { return null; } }
        function setToken(t) { try { t ? sessionStorage.setItem(KEY, t) : sessionStorage.removeItem(KEY); } catch (e) {} }
        function msg(text, isError) { $('msg').textContent = text; $('msg').className = isError ? 'error' : ''; }

        async function api(method, body) {
            const qs = method === 'GET' && $('filter').value ? '?status=' + encodeURIComponent($('filter').value) : '';
            const r = await fetch('/api/admin-claims' + qs, {
                method,
                headers: { 'x-admin-token': getToken() || '', 'Content-Type': 'application/json' },
                body: body ? JSON.stringify(body) : undefined
            });
            const data = await r.json().catch(() => ({}));
            if (r.status === 401) { setToken(null); showLogin(); throw new Error('Wrong or missing admin token.'); }
            if (!r.ok) throw new Error(data.error || ('Request failed (' + r.status + ')'));
            return data;
        }

        function td(text, className) {
            const c = document.createElement('td');
            c.textContent = text == null ? '' : text;
            if (className) c.className = className;
            return c;
        }
        const fmt = d => d ? new Date(d).toLocaleString() : '';

        function render() {
            const tbody = $('table').querySelector('tbody');
            tbody.replaceChildren();
            rows.forEach(row => {
                const tr = document.createElement('tr');
                tr.append(td('#' + row.piece), td('@' + row.twetch_handle), td(row.address, 'mono'),
                    td(row.status, row.status), td(fmt(row.claimed_at)), td(fmt(row.delivered_at)));
                const action = document.createElement('td');
                if (row.status === 'pending') {
                    const b = document.createElement('button');
                    b.textContent = 'Mark delivered';
                    b.addEventListener('click', async () => {
                        b.disabled = true;
                        try { await api('POST', { origin: row.origin }); await load(); }
                        catch (e) { msg(e.message, true); b.disabled = false; }
                    });
                    action.appendChild(b);
                }
                tr.appendChild(action);
                tbody.appendChild(tr);
            });
            $('table').hidden = false;
            msg(rows.length + ' claim' + (rows.length === 1 ? '' : 's') + '.');
        }

        async function load() {
            msg('Loading…');
            try { rows = (await api('GET')).claims; render(); }
            catch (e) { msg(e.message, true); }
        }

        function showLogin() { $('login').hidden = false; $('controls').hidden = true; $('table').hidden = true; }
        function showControls() { $('login').hidden = true; $('controls').hidden = false; load(); }

        function exportCsv() {
            const cols = ['piece', 'twetch_handle', 'address', 'origin', 'status', 'claimed_at', 'delivered_at'];
            const esc = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
            const csv = [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n');
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            a.download = 'twonk-claims-' + ($('filter').value || 'all') + '-' + new Date().toISOString().slice(0, 10) + '.csv';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        $('login').addEventListener('submit', e => { e.preventDefault(); setToken($('token').value.trim()); $('token').value = ''; showControls(); });
        $('filter').addEventListener('change', load);
        $('refresh').addEventListener('click', load);
        $('csv').addEventListener('click', exportCsv);
        $('logout').addEventListener('click', () => { setToken(null); rows = []; msg(''); showLogin(); });

        getToken() ? showControls() : showLogin();
    })();
    </script>
</body>
</html>
